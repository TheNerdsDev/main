# Pages CMS (https://pagescms.org): the editor for the site's projects.
#
# Open https://app.pagescms.org, sign in with GitHub, open TheNerdsDev/main
# and switch to the new_version branch. Saving there commits to the repo; the
# pages are built from src/content/projects.json (`npm run pages`, which
# `npm run dev` and `npm run build` run first).

media:
  input: public/media
  output: /media
  categories: [image, video]

content:
  - name: projects
    label: Projects
    type: file
    path: src/content/projects.json
    format: json
    fields:
      - name: projects
        label: Projects
        description: In the order they appear on the site. Drag one to move it.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({year})"
        fields:
          - name: name
            label: Name
            type: string
            required: true
            options: { maxlength: 60 }
          - name: slug
            label: Page address
            description: "The page's URL, /work/<this>/. Lowercase letters, numbers and dashes only (e.g. css-arena). Each project's must be different; avoid changing it once the page is live."
            type: string
            required: true
            options: { maxlength: 60 }
          - name: year
            label: Year
            type: string
            options: { maxlength: 4 }
          - name: role
            label: Role
            description: e.g. Design & Development
            type: string
          - name: excerpt
            label: Short line
            description: Under the card on the home page, e.g. "Live CSS battle platform".
            type: string
            options: { maxlength: 60 }
          - name: description
            label: Description
            description: The paragraph on the project's page.
            type: text
          - name: deliverables
            label: Scope
            description: One item each, e.g. Code editor, Live timer.
            type: string
            list: true
          - name: accent
            label: Accent colour
            description: "A hex colour like #9259EE: the card's hover glow and the page's tint."
            type: string
            options: { maxlength: 7 }
          - name: github
            label: GitHub link
            description: "The repository's address, shown as \"Code — GitHub\" on its page. Leave empty to hide it."
            type: string
          - name: thumbnail
            label: Thumbnail
            description: The card image. 4:3, 1600×1200 is ideal (JPG or WebP).
            type: image
            required: true
            options:
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: stillThumbnail
            label: Thumbnail is a screenshot or poster
            description: "On: shown whole and centred. Off: zoomed slightly, drifting as the reel moves (made for photos)."
            type: boolean
          - name: video
            label: Walkthrough video
            description: Plays on the card when hovered. MP4 (H.264), 4:3 like the thumbnail, a few MB at most.
            type: file
            options:
              extensions: [mp4]
              rename: safe
          - name: pageVideo
            label: Lead its page with the video
            description: "On: the project's page opens with the video, playing on a loop (needs a video above)."
            type: boolean
          - name: shots
            label: Screenshots
            description: "On its page: the first full width (2.1:1, e.g. 2100×1000), the rest two to a row (1.62:1, e.g. 1620×1000). None yet: three empty frames hold the layout."
            type: image
            options:
              multiple: { max: 9 }
              extensions: [jpg, jpeg, png, webp]
              rename: safe
          - name: certificates
            label: Certificates
            description: Pinned either side of the video, the first on the left. Portrait images.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{name}"
            fields:
              - name: name
                label: Whose
                type: string
                required: true
              - name: image
                label: Image
                type: image
                required: true
                options:
                  extensions: [jpg, jpeg, png, webp]
                  rename: safe
